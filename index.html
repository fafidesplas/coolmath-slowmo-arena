<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2e4cc" />
    <title>Slowsteel — time moves when you move</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l1.2 9H6.8z' fill='%23dfe6ee'/%3E%3Crect x='4.5' y='10' width='7' height='1.4' fill='%23d9a944'/%3E%3Crect x='7.3' y='11.4' width='1.4' height='3.4' fill='%23e3262c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="prompt"></div>
      <div id="timebar"><div id="timefill"></div><span>TIME</span></div>
      <div id="status">
        <div id="lvl">LEVEL 1</div>
        <div id="xp"><div id="xpfill"></div></div>
        <div id="hearts"></div>
      </div>
      <div id="held"></div>
      <div id="hint"></div>
      <div id="fx"></div>
    </div>
    <div id="banner"></div>
    <div id="touch" class="hidden">
      <div id="joy-base"><div id="joy-knob"></div></div>
      <div id="tbtns">
        <button class="tbtn grab hidden" data-act="grab">GRAB</button>
        <button class="tbtn throw" data-act="throw">THROW</button>
        <button class="tbtn attack" data-act="attack">ATTACK</button>
      </div>
    </div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
